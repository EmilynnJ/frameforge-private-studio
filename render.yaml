services:
  - type: web
    name: studiocut-private-studio
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: STUDIO_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studiocut-postgres
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false

databases:
  - name: studiocut-postgres
    plan: basic-256mb
    databaseName: studiocut
    user: studiocut
